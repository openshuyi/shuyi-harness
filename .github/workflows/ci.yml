name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Lint (ultracite/biome)
        run: bun x ultracite check

      - name: Typecheck (turbo, 全仓)
        run: bun run check-types

      - name: Test
        run: cd apps/server && bun test

      - name: Build (turbo: server + web)
        run: bun run build
